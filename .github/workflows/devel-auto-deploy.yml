name: "automatic deploy of devel branch to dev instance"
on:
  push:
    branches:
      - devel
jobs:
  devel-auto-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: dev0-deploy-group
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v3
    - uses: webfactory/ssh-agent@v0.8.0
      with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    - uses: cachix/install-nix-action@v31.11.0
      with:
        nix_path: nixpkgs=channel:nixos-26.05
        extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
    - run: git status
    - name: Pull latest config and submodules
      run: ssh -oStrictHostKeyChecking=no root@${{ vars.DEV_INSTANCE }} "set -ex; cd /etc/nixos; git pull --rebase; git submodule update --init --remote --recursive"
    - name: Stop services and rebuild
      run: ssh -oStrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=40 root@${{ vars.DEV_INSTANCE }} "set -ex; cd /etc/nixos; systemctl stop op-energy-account-service.service; nixos-rebuild switch; nix-collect-garbage -d"
    - name: Start services in order and reload nginx
      run: ssh -oStrictHostKeyChecking=no root@${{ vars.DEV_INSTANCE }} "set -ex; systemctl start op-energy-backend-mainnet.service; sleep 5; systemctl restart op-energy-account-service.service; systemctl reload nginx; systemctl is-active op-energy-backend-mainnet.service; systemctl is-active op-energy-account-service.service; systemctl is-active nginx.service"
